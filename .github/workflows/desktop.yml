name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Package desktop application
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check packaged Windows application
        if: matrix.platform == 'win'
        run: node scripts/smoke-desktop.mjs "release/win-unpacked/TRAE社区.exe"
      - name: Calculate SHA256 checksums
        run: node scripts/checksums.mjs
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: TRAE-Forum-Client-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.deb
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: TRAE-Forum-Client-*
          path: release
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/checksums.mjs
      - name: Publish release packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "${RELEASE_TAG#v}" --prerelease --notes-file RELEASE_NOTES.md
          fi
          gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" release/* --clobber
